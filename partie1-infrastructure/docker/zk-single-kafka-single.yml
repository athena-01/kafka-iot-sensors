version: '3.8'

services:
  zoo1:
    image: confluentinc/cp-zookeeper:7.8.0
    hostname: zoo1
    container_name: zoo1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SERVER_ID: 1
    networks:
      - reseau-isri

  kafka1:
    image: confluentinc/cp-kafka:7.8.0
    hostname: kafka1
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: "zoo1:2181"
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zoo1
    networks:
      - reseau-isri

  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:3.0
    container_name: fluent-bit
    volumes:
      - ../fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ../../logs:/var/log/global_logs:ro
    ports:
      - "24224:24224"
      - "2020:2020"
    depends_on:
      - kafka1
      - loki
    networks:
      - reseau-isri

  loki:
    image: grafana/loki:2.9.4
    container_name: loki_isri
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - reseau-isri

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    # ── AJOUT CRUCIAL POUR LE RÉSEAU LINUX ──
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - kafka1
    networks:
      - reseau-isri

  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana_isri
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning
      - ../grafana/dashboards_json:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - reseau-isri

  producteur-api:
    build:
      context: ../..
      dockerfile: partie2-producteurs/docker/Dockerfile.api
    container_name: producteur_api
    environment:
      KAFKA_BROKER: kafka1:19092
      KAFKA_TOPIC: capteurs-topic
      OPENWEATHER_API_KEY: 4727fe3a0de0156c59ae21c0e063d32f
      VILLES: "Amiens,FR;Paris,FR;Lyon,FR"
      INTERVALLE_SECONDES: "60"
    depends_on:
      - kafka1
    networks:
      - reseau-isri

# ── TON INFRASTRUCTURE DEVIENT CLIENTE DU RÉSEAU CENTRAL ──
networks:
  reseau-isri:
    external: true
    name: reseau-isri  # ◄ FORCE LE NOM DE RÉSEAU EXACT